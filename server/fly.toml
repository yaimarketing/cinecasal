# Fly.io: fly launch --no-deploy && fly deploy   (dentro de watchparty/server)
app = "watchparty-sync"
primary_region = "gru"

[build]
  [build.args]
    NODE_VERSION = "22"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
